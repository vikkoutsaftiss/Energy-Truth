name: Energy-Truth.sln

on:
  push:
    branches:
      - '**'
    paths:
        - 'k8s/frontend/**'
        - 'Energy-Truth-Front/**'
  pull_request:
    branches:
      - '**'
    paths:
        - 'k8s/frontend/**'
        - 'Energy-Truth-Front/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dependencies herstellen
        run: dotnet restore Energy-Truth.slnx

      - name: Check for packages with vulnerabilities
        run: dotnet list package --vulnerable

      - name: Build project
        run: dotnet build Energy-Truth.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test Energy-Truth.slnx --no-build --verbosity normal

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:latest  

    
