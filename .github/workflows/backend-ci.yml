name: Energy-Truth-Backend-CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'k8s/backend/**'
      - 'Energy-Truth-WEB-API/**'
      - 'Energy-Truth.Shared/**'
      - 'Infrastructure.DataAcess/**' #  Toegevoegd bij push
        
  pull_request:
    branches:
      - '**'
    paths:
      - 'k8s/backend/**'
      - 'Energy-Truth-WEB-API/**'
      - 'Energy-Truth.Shared/**'
      - 'Infrastructure.DataAcess/**' # Nu ook synchroon bij PR

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dependencies herstellen
        run: dotnet restore Energy-Truth.slnx

      - name: Check for packages with vulnerabilities
        run: dotnet list package --vulnerable

      # Build de solution, maar geef expliciet aan dat testomgevingen/browsers genegeerd mogen worden tijdens build
      - name: Build project
        run: dotnet build Energy-Truth.slnx --no-restore --configuration Release /p:IsTestProject=false

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Genereer datum-tijd stempel
      id: datetime
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Backend
      uses: docker/build-push-action@v5
      with:
        # Context staat op root voor toegang tot de shared folder
        context: .
        # Specifiek pad naar de Dockerfile in de submap
        file: ./Energy-Truth-WEB-API/Dockerfile
        platforms: linux/amd64 # <<< DIT DWINGT DE JUISTE CPU-INSTRUCTIES AF
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/energy-truth-backend:latest
          ghcr.io/${{ github.repository_owner }}/energy-truth-backend:${{ steps.datetime.outputs.timestamp }}
