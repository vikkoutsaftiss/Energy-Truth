# =====================================================================
# algoritme-ci.yml  --  CI/CD voor de Energy-Truth algoritme-worker
#
# Dit is een KLAAR-VOOR-GEBRUIK sjabloon, nagebouwd op Vik's
# .github/workflows/backend-ci.yml, maar dan voor Python i.p.v. .NET.
#
# WAAR HOORT DIT BESTAND?
#   In de repo onder  .github/workflows/algoritme-ci.yml
#   (dezelfde plek als backend-ci.yml en frontend-ci.yml).
#
# WAT DOET HET?
#   1. Smoke-test: code compileert + geen ongebruikte imports (pyflakes).
#   2. Alleen op master: bouwt de Docker-image en pusht hem naar de
#      GitHub Container Registry (ghcr.io), net als de backend.
#   Net als bij de backend zit er BEWUST geen automatische deploy naar het
#   cluster in: dat doet Marijn (of jij) met `kubectl apply -k`.
#
# De Python-code staat in de repo-map  Python/  (op de python-report branch).
# De image gaat naar ghcr.io/<repo-owner>/energy-truth-algoritme.
# =====================================================================
name: Energy-Truth-Algoritme-CI

on:
  push:
    branches: ["master"]
    paths:
      - "Python/**"
#      - "k8s/algoritme/**"
#      - ".github/workflows/algoritme-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "Python/**"
      - "k8s/algoritme/**"

jobs:
  # --- 1. Smoke-test: draait op elke push/PR -------------------------
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        working-directory: Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Code compileert (syntaxcheck)
        working-directory: Python
        run: python -m compileall -q .

      - name: Geen ongebruikte imports / dode code
        working-directory: Python
        run: pyflakes .

  # --- 2. Image bouwen + pushen: alleen op master --------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Genereer datum-tijd stempel
        id: datetime
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Login bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build en Push algoritme-image
        uses: docker/build-push-action@v5
        with:
          context: ./Python            # map met de Dockerfile
          file: ./Python/Dockerfile
          platforms: linux/amd64       # dwingt de juiste CPU-instructies af
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/energy-truth-algoritme:latest
            ghcr.io/${{ github.repository_owner }}/energy-truth-algoritme:${{ steps.datetime.outputs.timestamp }}
