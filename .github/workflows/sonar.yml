name: SonarQube Cloud Analysis
on:
  push:
    branches:
      - main
      - master
      - CSV-Importer-test
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-and-analyze:
    runs-on: windows-latest
    
    steps:
      # 1. Haal de code op uit GitHub
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cruciaal voor SonarQube om de Git-historie te begrijpen
      # 2. Installeer Java (SonarQube scanner draait op Java)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      # 3. Installeer .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 4. Installeer de SonarScanner tool wereldwijd op de GitHub-server
      - name: Install SonarQube Cloud scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
      # 5. Het bouwen, testen en scannen van de applicatie
      - name: Build, test and analyze
        shell: pwsh
        run: |
          # A. Start de SonarScanner en laat hem automatisch zoeken naar alle opencover bestanden
          dotnet-sonarscanner begin /k:"vikkoutsaftiss_Energy-Truth" /o:"vikkoutsaftiss" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.exclusions="**/.sonarqube/**,**/python/**,**/Python/**,**/*.py" /d:sonar.cs.opencover.reportsPaths="**\*.opencover.xml"
          
          # B. De werkelijke .NET Build
          dotnet build --configuration Release
          
          # C. Draai de Unit Tests met de ingebouwde XPlat coverage collector (E2E-tests uitgesloten)
          dotnet test --configuration Release --no-build --filter "FullyQualifiedName!~E2ETests" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          
          # D. Sluit de scan af en stuur de data naar SonarCloud
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
