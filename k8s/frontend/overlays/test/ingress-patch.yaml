apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: test.energy-truth.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: energytruth-frontend-service
                port:
                  number: 8080
