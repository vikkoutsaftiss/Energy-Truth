apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: energytruth-test
resources:
  - ../../base
  - ingress-patch.yaml
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: energytruth-frontend
  - path: service-patch.yaml
    target:
      kind: Service
      name: energytruth-frontend-service
