apiVersion: apps/v1
kind: Deployment
metadata:
  name: energytruth-frontend
spec:
  template:
    spec:
      containers:
      - name: frontend
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: network-config
                key: backend_url
        - name: ASPNETCORE_URLS
          value: "http://+:80"
