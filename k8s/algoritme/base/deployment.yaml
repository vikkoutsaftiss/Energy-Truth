# =====================================================================
# Deployment -- de worker (poller).
#
# Een "Deployment" zorgt dat er altijd een pod (ons doosje) draait en hem
# herstart als hij stopt. De worker heeft GEEN eigen webadres: hij kijkt
# elke 30s in de database of er een batch klaarstaat en rekent die door.
# Daarom 1 replica (een poller hoef je niet te dupliceren).
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energytruth-algoritme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: algoritme
  template:
    metadata:
      labels:
        app: algoritme
    spec:
      # De image staat in een PRIVATE GitHub Container Registry (ghcr.io).
      # Dit Secret geeft het cluster toegang om hem op te halen. Het bestaat
      # al in de namespace: Vik's backend gebruikt exact hetzelfde Secret.
      imagePullSecrets:
        - name: github-registry-secret
      # --- Veiligheid op pod-niveau (veiligheidsrapport punt 7) ---
      securityContext:
        runAsNonRoot: true          # nooit als root draaien
        runAsUser: 10001            # de 'appuser' uit de Dockerfile
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: energytruth-algoritme   # echte registry + tag komt uit de overlay
          # CMD uit de Dockerfile draait worker.py; hier niets overschrijven.
          # --- Veiligheid op container-niveau ---
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true  # schijf is alleen-lezen...
            capabilities:
              drop: ["ALL"]
          # DB-credentials per key uit db-auth (backend-stijl, zoals Marijn vroeg).
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_IP
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: DATABASE_IP
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: DATABASE_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_PASSWORD
           # smtp secret env connection 
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: SMTP_PASS
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: MAIL_FROM
            - name: MAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: smtp-auth
                  key: MAIL_FROM_NAME
          # Niet-geheime config (defaults in de code) via de ConfigMap.
          envFrom:
            - configMapRef:
                name: algoritme-config  # DB_SSLMODE, timeouts, POLL_INTERVAL, LOG_LEVEL
          # --- Resourcegrenzen (veiligheidsrapport punt 2: DoS-vangnet) ---
          # Begin niet te krap met memory: de pandas-loops kunnen pieken.
          # Bij 'OOMKilled' gewoon de limit ophogen.
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # ...maar /tmp moet schrijfbaar zijn (matplotlib-cache, MPLCONFIGDIR).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
