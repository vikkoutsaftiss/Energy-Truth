apiVersion: apps/v1
kind: Deployment
metadata:
  name: energytruth-algoritme
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1500m"
