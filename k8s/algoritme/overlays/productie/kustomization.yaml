apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dwing de productie-namespace af
namespace: energytruth-productie

resources:
  - ../../base

# Overschrijf de resources voor productie (het algoritme mag hier meer RAM gebruiken)
patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: algoritme-worker
    spec:
      template:
        spec:
          containers:
          - name: worker
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "2"
