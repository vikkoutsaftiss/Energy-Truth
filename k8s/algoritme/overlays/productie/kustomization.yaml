apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dwing de productie-namespace af
namespace: energytruth-productie

# Voeg de prod- prefix toe zoals Vik dat ook doet
namePrefix: prod-

resources:
  - ../../base

# Essentieel: Overschrijf de image naar de juiste GitHub Registry tag
images:
  - name: energytruth-algoritme
    newName: ghcr.io/vikkoutsaftiss/energy-truth-algoritme
    newTag: latest

# Gecorrigeerde patches syntax zonder string-pipes (|-) om ArgoCD te pleasen
patches:
  - target:
      version: v1
      kind: Deployment
      name: algoritme-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
