apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dwing de productienamespace af
namespace: energytruth-productie

# Voeg de prod- prefix toe voor service-matching
namePrefix: prod-

resources:
  - ../../base

# Koppel de officiële GitHub Container Registry image
images:
  - name: energytruth-algoritme
    newName: ghcr.io/vikkoutsaftiss/energy-truth-algoritme
    newTag: latest

# Verwijs naar je losse patch-bestand, exact zoals bij de frontend/backend
patchesStrategicMerge:
  - deployment-patch.yaml
