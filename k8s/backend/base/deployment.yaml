apiVersion: apps/v1
kind: Deployment
metadata:
  name: energytruth-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energytruth-backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
      labels:
        app: energytruth-backend
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      hostNetwork: true # <<< DIT DWINGT DE POD DIRECT OP HET FYSIEKE IP (10.0.30.11) VAN DE NODE
      dnsPolicy: ClusterFirstWithHostNet # <<< VEREIST: Behoudt toegang tot CoreDNS!
      containers:
        - name: backend
          image: ghcr.io/vikkoutsaftiss/energy-truth-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-network-config
                  key: frontend_url
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-network-config
                  key: backend_url
            - name: ALGORITME_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-network-config
                  key: algoritme_url
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            # Database credentials uit het Secret
            - name: DATABASE_IP
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: DATABASE_IP
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: DATABASE_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
