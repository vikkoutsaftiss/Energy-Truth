apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: energytruth-productie
namePrefix: prod-

resources:
  - ../../base
  - backendconfigmap.yaml
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: energytruth-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/valueFrom/configMapKeyRef/name
        value: backend-network-config
      - op: replace
        path: /spec/template/spec/containers/0/env/6/valueFrom/configMapKeyRef/name
        value: backend-network-config
      - op: replace
        path: /spec/template/spec/containers/0/env/7/valueFrom/configMapKeyRef/name
        value: backend-network-config
images:
  - name: ghcr.io/vikkoutsaftiss/energy-truth-backend
    newTag: latest
