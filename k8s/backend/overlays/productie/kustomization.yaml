apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: energytruth-productie
namePrefix: prod-

resources:
  - ../../base
  - configmap.yaml
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: energytruth-backend

images:
  - name: ghcr.io/vikkoutsaftiss/energy-truth-backend
    newTag: latest
