apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api-test.energy-truth.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: energytruth-backend-service
            port:
              number: 80
